<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sucursales</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main class="app-shell abm-shell">
    <section class="abm-layout">
      <header class="abm-header">
        <h2>Sucursales</h2>
        <input id="buscar" class="form-control" placeholder="Buscar sucursal...">
        <label>
          <input type="checkbox" id="verEliminados">
          Mostrar eliminadas
        </label>
      </header>

      <div class="table-wrap">
        <table class="tabla">
          <thead>
            <tr>
              <th>Codigo</th>
              <th>Nombre</th>
              <th>Local</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>

      <form class="abm-form" onsubmit="return false;">
        <h3 id="tituloForm">Nueva Sucursal</h3>
        <input id="codigo" class="form-control" placeholder="Codigo">
        <input id="nombre" class="form-control" placeholder="Nombre">
        <input id="direccion" class="form-control" placeholder="Direccion">
        <input id="telefono" class="form-control" placeholder="Telefono">
        <label class="full-row">
          <input type="checkbox" id="sucursalLocal">
          Sucursal local
        </label>
        <div class="form-actions">
          <button id="guardar" type="button" class="btn btn-primary">Guardar</button>
          <button id="cancelar" type="button" class="btn btn-secondary" style="display:none;">Cancelar</button>
        </div>
      </form>
    </section>
  </main>

  <script src="sucursales.js"></script>
</body>
</html>
