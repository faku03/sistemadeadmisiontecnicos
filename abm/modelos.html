<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Modelos</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>

<h2>Modelos</h2>

<!-- BUSCADOR -->
<div style="margin-bottom:10px">
  <input id="buscar" placeholder="Buscar por tipo, marca o modelo">
  <button id="btnBuscar">Buscar</button>

  <label style="margin-left:10px">
    <input type="checkbox" id="verEliminados">
    Mostrar eliminados
  </label>
</div>

<!-- GRILLA -->
<table width="100%" border="1" cellspacing="0" cellpadding="5">
  <thead>
    <tr>
      <th>Tipo de equipo</th>
      <th>Marca</th>
      <th>Modelo</th>
      <th>Estado</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody id="tabla"></tbody>
</table>

<hr>

<!-- FORM -->
<h3 id="tituloForm">Nuevo Modelo</h3>

<select id="tipoEquipo">
  <option value="">Tipo de equipo</option>
</select>

<select id="marca">
  <option value="">Marca</option>
</select>

<input id="nombre" placeholder="Modelo">

<br><br>

<button id="guardar">Guardar</button>
<button id="cancelar" style="display:none">Cancelar</button>

<script src="modelos.js"></script>
</body>
</html>
