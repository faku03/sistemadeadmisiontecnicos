<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Marcas</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main class="app-shell abm-shell">
    <section class="abm-layout">
      <header class="abm-header">
        <h2>Marcas</h2>
        <input id="buscar" class="form-control" placeholder="Buscar...">
        <label>
          <input type="checkbox" id="verEliminados">
          Mostrar eliminadas
        </label>
      </header>

      <div class="table-wrap">
        <table class="tabla">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>

      <form class="abm-form" onsubmit="return false;">
        <h3 id="tituloForm">Nueva Marca</h3>
        <input id="nombre" class="form-control full-row" placeholder="Nombre">
        <div class="form-actions">
          <button id="guardar" class="btn btn-primary">Guardar</button>
          <button id="cancelar" class="btn btn-secondary" style="display:none;">Cancelar</button>
        </div>
      </form>
    </section>
  </main>

  <script src="marcas.js"></script>
</body>
</html>
