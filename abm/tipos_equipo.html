<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Tipos de Equipo</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main class="app-shell abm-shell">
    <section class="abm-layout">
      <header class="abm-header">
        <h2>Tipos de Equipo</h2>
        <input id="buscar" class="form-control" placeholder="Buscar...">
        <label>
          <input type="checkbox" id="verEliminados">
          Mostrar eliminados
        </label>
      </header>

      <div class="table-wrap">
        <table class="tabla">
          <thead>
            <tr>
              <th>Codigo</th>
              <th>Descripcion</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>

      <form class="abm-form" onsubmit="return false;">
        <h3 id="tituloForm">Nuevo Tipo</h3>
        <input id="codigo" class="form-control" placeholder="Codigo">
        <input id="descripcion" class="form-control" placeholder="Descripcion">
        <div class="form-actions">
          <button id="guardar" type="button" class="btn btn-primary">Guardar</button>
          <button id="cancelar" type="button" class="btn btn-secondary" style="display:none;">Cancelar</button>
        </div>
      </form>
    </section>
  </main>

  <script src="tipos_equipo.js"></script>
</body>
</html>
