<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Clientes</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main class="app-shell abm-shell">
    <section class="abm-layout">
      <header class="abm-header">
        <h2>Clientes</h2>
        <input id="buscar" class="form-control" placeholder="Buscar por DNI, nombre, apellido o celular...">
        <label>
          <input type="checkbox" id="verEliminados">
          Mostrar eliminados
        </label>
      </header>

      <div class="table-wrap">
        <table class="tabla">
          <thead>
            <tr>
              <th>DNI</th>
              <th>Nombre</th>
              <th>Apellido</th>
              <th>Celular</th>
              <th>Email</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>

      <form class="abm-form" onsubmit="return false;">
        <h3 id="tituloForm">Nuevo Cliente</h3>
        <input id="dni" class="form-control" placeholder="DNI">
        <input id="nombre" class="form-control" placeholder="Nombre">
        <input id="apellido" class="form-control" placeholder="Apellido">
        <input id="celular" class="form-control" placeholder="Celular">
        <input id="email" class="form-control full-row" placeholder="Email">
        <div class="form-actions">
          <button id="guardar" type="button" class="btn btn-primary">Guardar</button>
          <button id="cancelar" type="button" class="btn btn-secondary" style="display:none;">Cancelar</button>
        </div>
      </form>
    </section>
  </main>

  <script src="clientes.js"></script>
</body>
</html>
